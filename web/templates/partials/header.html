{{ define "header" }}
<header class="header">
  <a class="logo" href="/">FlowModel</a>
  <nav class="nav" aria-label="Основная навигация">
    <a href="/" id="home-link" style="display: none;">Расчёт</a>
    <a href="/cabinet" id="cabinet-link" style="display: none;">Кабинет</a>
    <a href="/admin" id="admin-link" style="display: none;">Админ</a>
    <a href="#" id="logout-btn" style="display: none;">Выход</a>
    <a href="/login" id="login-link" style="display: none;">Вход</a>
  </nav>
</header>
<script>
(function() {
  function updateNav() {
    const token = sessionStorage.getItem('flowmodel_token');
    const role = sessionStorage.getItem('flowmodel_role');
    const currentPath = window.location.pathname;
    
    const homeLink = document.getElementById('home-link');
    const loginLink = document.getElementById('login-link');
    const logoutBtn = document.getElementById('logout-btn');
    const cabinetLink = document.getElementById('cabinet-link');
    const adminLink = document.getElementById('admin-link');
    
    if (!token) {
      if (homeLink) homeLink.style.display = 'none';
      if (loginLink) loginLink.style.display = 'inline';
      if (logoutBtn) logoutBtn.style.display = 'none';
      if (cabinetLink) cabinetLink.style.display = 'none';
      if (adminLink) adminLink.style.display = 'none';
      return;
    }
    
    if (loginLink) loginLink.style.display = 'none';
    if (logoutBtn) logoutBtn.style.display = 'inline';
    
    if (role === 'admin') {
      if (homeLink) homeLink.style.display = 'none';
      if (cabinetLink) cabinetLink.style.display = 'none';
      if (adminLink) adminLink.style.display = 'inline';
      
      if (currentPath !== '/admin' && 
          currentPath !== '/login' && 
          !currentPath.startsWith('/static/') &&
          !currentPath.startsWith('/api/')) {
        window.location.href = '/admin';
      }
      return;
    }
    
    if (homeLink) homeLink.style.display = 'inline';
    if (cabinetLink) cabinetLink.style.display = 'inline';
    if (adminLink) adminLink.style.display = 'none';
  }
  
  document.addEventListener('DOMContentLoaded', updateNav);
  window.addEventListener('storage', updateNav);
  
  const logoutBtn = document.getElementById('logout-btn');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      try { await FlowModelAPI.client.auth.logout(); } catch (e) {}
      sessionStorage.clear();
      window.location.href = '/login';
    });
  }
})();
</script>
{{ end }}
