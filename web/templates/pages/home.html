{{ define "content" }}
<div class="container">
  <h1>FlowModel</h1>
  <p style="margin-bottom: 30px; color: var(--muted);">Расчёт неизотермического течения аномально-вязких материалов</p>

  <div class="card">
    <h2 style="margin-top: 0;">Параметры расчёта</h2>
    <form id="calculate-form">
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
        <div class="form-group">
          <label>Ширина W (м)</label>
          <input type="number" name="w" value="0.25" step="0.001" min="0.001" max="10.0" required>
        </div>
        <div class="form-group">
          <label>Глубина H (м)</label>
          <input type="number" name="h" value="0.01" step="0.001" min="0.001" max="1.0" required>
        </div>
        <div class="form-group">
          <label>Длина L (м)</label>
          <input type="number" name="l" value="9.5" step="0.01" min="0.01" max="100.0" required>
        </div>
        <div class="form-group">
          <label>Скорость Vu (м/с)</label>
          <input type="number" name="vu" value="1.5" step="0.1" min="0" max="100.0" required>
        </div>
        <div class="form-group">
          <label>Температура Tu (°C)</label>
          <input type="number" name="tu" value="150" step="1" min="0" max="500" required>
        </div>
        <div class="form-group">
          <label>Температура T0 (°C)</label>
          <input type="number" name="t0" value="145" step="1" min="0" max="500" required>
        </div>
        <div class="form-group">
          <label>Материал</label>
          <select name="material_id" required>
            <option value="1">ПВХ</option>
          </select>
        </div>
        <div class="form-group">
          <label>Шаги</label>
          <input type="number" name="steps" value="50" step="1" min="10" max="500" required>
        </div>
        <div class="form-group" style="display: flex; align-items: flex-end;">
          <button type="submit" class="btn btn-primary btn-block">Рассчитать</button>
        </div>
      </div>
    </form>
    <div id="error-message" style="color: var(--pink); margin-top: 16px;"></div>
  </div>

  <div id="results" style="display: none;">
    <div class="card">
      <h2 style="margin-top: 0;">Результаты</h2>
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px;">
        <div><strong>Производительность:</strong> <span id="productivity"></span> м³/с</div>
        <div><strong>Температура:</strong> <span id="temperature"></span> °C</div>
        <div><strong>Вязкость:</strong> <span id="viscosity"></span> Па·с</div>
      </div>
    </div>

    <div class="chart-container">
      <h3>Распределение по длине канала (2D)</h3>
      <canvas id="chart2d"></canvas>
    </div>

    <div class="chart-container">
      <h3>3D визуализация</h3>
      <div id="chart3d"></div>
    </div>
  </div>
</div>

<script src="/static/js/pages/home.js" defer></script>
{{ end }}
