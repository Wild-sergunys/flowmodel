{{ define "content" }}
<div class="container" style="max-width: 500px;">
  <h1>Вход</h1>
  
  <div class="card">
    <form id="login-form">
      <div class="form-group">
        <label>Логин</label>
        <input type="text" name="login" placeholder="Введите логин" required>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" name="password" placeholder="Введите пароль" required>
      </div>
      <div id="login-error" style="color: var(--pink); margin-bottom: 16px;"></div>
      <button type="submit" class="btn btn-primary btn-block">Войти</button>
    </form>
  </div>

  <p style="margin-top: 20px; text-align: center; color: var(--muted);">
    Нет аккаунта? <a href="#" id="register-link">Зарегистрироваться</a>
  </p>

  <div id="register-form" style="display: none;">
    <div class="card">
      <h2 style="margin-top: 0;">Регистрация</h2>
      <form id="register-form-element">
        <div class="form-group">
          <label>Логин</label>
          <input type="text" name="login" placeholder="Придумайте логин" required>
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" name="password" placeholder="Минимум 6 символов" required minlength="6">
        </div>
        <div id="register-error" style="color: var(--pink); margin-bottom: 16px;"></div>
        <button type="submit" class="btn btn-primary btn-block">Создать аккаунт</button>
      </form>
    </div>
  </div>
</div>

<script src="/static/js/pages/login.js" defer></script>
{{ end }}
