{{ define "content" }}
<div class="container">
  <h1>Админ-панель</h1>

  <div style="display: flex; gap: 20px; margin-bottom: 30px; border-bottom: 3px solid #1a1a1a; padding-bottom: 10px;">
    <button class="btn btn-small tab-btn active" data-tab="materials">Материалы</button>
    <button class="btn btn-small tab-btn" data-tab="parameters">Параметры</button>
    <button class="btn btn-small tab-btn" data-tab="users">Пользователи</button>
  </div>

  <div id="tab-materials" class="tab-content">
    <div class="card">
      <h2 style="margin-top: 0;">Материалы</h2>
      <div class="table-wrapper">
        <table id="materials-table">
          <thead>
            <tr><th>ID</th><th>Название</th><th>Описание</th><th>Действия</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="tab-parameters" class="tab-content" style="display: none;">
    <div class="card">
      <h2 style="margin-top: 0;">Параметры</h2>
      <div class="table-wrapper">
        <table id="parameters-table">
          <thead>
            <tr><th>ID</th><th>Код</th><th>Название</th><th>Ед. изм.</th><th>Тип</th><th>Категория</th><th>Действия</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="tab-users" class="tab-content" style="display: none;">
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0;">Пользователи</h2>
        <button class="btn btn-primary" id="add-user-btn">Добавить пользователя</button>
      </div>
      <div class="table-wrapper">
        <table id="users-table">
          <thead>
            <tr><th>ID</th><th>Логин</th><th>Роль</th><th>Создан</th><th>Действия</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="create-user-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div class="card" style="max-width: 400px; margin: auto;">
      <h3 style="margin-top: 0;">Создать пользователя</h3>
      <form id="create-user-form">
        <div class="form-group">
          <label>Логин</label>
          <input type="text" name="login" required minlength="3" maxlength="50">
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" name="password" required minlength="6">
        </div>
        <div class="form-group">
          <label>Роль</label>
          <select name="role" required>
            <option value="researcher">Исследователь</option>
            <option value="admin">Администратор</option>
          </select>
        </div>
        <div id="create-user-error" style="color: var(--pink); margin-bottom: 16px;"></div>
        <div style="display: flex; gap: 10px;">
          <button type="submit" class="btn btn-primary" style="flex: 1;">Создать</button>
          <button type="button" class="btn" id="cancel-create-user" style="flex: 1;">Отмена</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="/static/js/pages/admin.js" defer></script>
{{ end }}
