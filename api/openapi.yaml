openapi: 3.0.0
info:
  title: flowmodel API
  description: API для моделирования неизотермического течения аномально-вязких материалов в канале с подвижной крышкой
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Локальный сервер разработки

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT токен, полученный при входе

  schemas:
    # Аутентификация
    RegisterRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 50
          description: Логин пользователя
        password:
          type: string
          minLength: 6
          maxLength: 100
          description: Пароль пользователя
          format: password

    LoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 50
          description: Логин пользователя
        password:
          type: string
          minLength: 6
          maxLength: 100
          description: Пароль пользователя
          format: password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT токен для авторизации
        role:
          type: string
          enum: [researcher, admin]
          description: Роль авторизованного пользователя

    # Расчёт
    CalculationInput:
      type: object
      required:
        - w
        - h
        - l
        - vu
        - tu
        - material_id
        - t0
        - steps
      properties:
        w:
          type: number
          format: double
          minimum: 0.001
          maximum: 10.0
          description: Ширина канала, м
          example: 0.25
        h:
          type: number
          format: double
          minimum: 0.001
          maximum: 1.0
          description: Глубина канала, м
          example: 0.01
        l:
          type: number
          format: double
          minimum: 0.01
          maximum: 100.0
          description: Длина канала, м
          example: 9.5
        vu:
          type: number
          format: double
          minimum: 0.0
          maximum: 100.0
          description: Скорость верхней крышки, м/с
          example: 1.5
        tu:
          type: number
          format: double
          minimum: 0.0
          maximum: 500.0
          description: Температура верхней крышки, °С
          example: 150.0
        material_id:
          type: integer
          minimum: 1
          description: Идентификатор материала из справочника
          example: 1
        t0:
          type: number
          format: double
          minimum: 0.0
          maximum: 500.0
          description: Начальная температура материала (температура плавления), °С
          example: 145.0
        steps:
          type: integer
          minimum: 10
          maximum: 100000
          description: Количество шагов интегрирования по длине канала
          example: 1000

    Point:
      type: object
      description: Точка профиля по длине канала
      properties:
        x:
          type: number
          format: double
          description: Координата по длине канала, м
          example: 1.5
        temperature:
          type: number
          format: double
          description: Средняя температура материала в сечении, °С
          example: 152.3
        viscosity:
          type: number
          format: double
          description: Динамическая вязкость материала в сечении, Па·с
          example: 8450.2

    Metrics:
      type: object
      description: Показатели экономичности расчёта
      properties:
        calc_time_ms:
          type: integer
          description: Время расчёта в миллисекундах
          example: 42
        memory_used_bytes:
          type: integer
          description: Объём использованной оперативной памяти в байтах
          example: 2048000

    CalculationResult:
      type: object
      description: Результаты моделирования
      properties:
        id:
          type: integer
          description: Идентификатор сохранённого расчёта
          example: 42
        productivity:
          type: number
          format: double
          description: Объёмный расход (производительность), м³/с
          example: 0.001875
        temperature:
          type: number
          format: double
          description: Температура продукта на выходе из канала, °С
          example: 158.7
        viscosity:
          type: number
          format: double
          description: Вязкость продукта на выходе из канала, Па·с
          example: 6200.5
        profile:
          type: array
          description: Распределения температуры и вязкости по длине канала
          items:
            $ref: '#/components/schemas/Point'
        metrics:
          $ref: '#/components/schemas/Metrics'

    # Справочники
    Material:
      type: object
      description: Тип перерабатываемого материала
      properties:
        id:
          type: integer
          readOnly: true
          description: Уникальный идентификатор
          example: 1
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Название материала
          example: "Поливинилхлорид (ПВХ)"
        description:
          type: string
          nullable: true
          description: Текстовое описание материала
          example: "Термопластичный полимер, используемый в производстве труб и профилей"
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Дата и время создания записи
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Дата и время последнего обновления записи

    MaterialListItem:
      type: object
      description: Краткая информация о материале для выпадающего списка
      properties:
        id:
          type: integer
          description: Уникальный идентификатор
        name:
          type: string
          description: Название материала

    Parameter:
      type: object
      description: Мета-описание параметра (словарь)
      properties:
        id:
          type: integer
          readOnly: true
          description: Уникальный идентификатор
          example: 1
        code:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[a-z0-9_]+$'
          description: Технический код параметра (латиница, цифры, подчёркивание)
          example: "density"
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Человекочитаемое название параметра
          example: "Плотность"
        unit:
          type: string
          nullable: true
          description: Единица измерения
          example: "кг/м³"
        data_type:
          type: string
          enum: [float, int, string]
          description: Тип данных значения параметра
          example: "float"
        category:
          type: string
          enum: [material_property, empirical_coefficient, process_parameter]
          description: Категория параметра
          example: "material_property"
        description:
          type: string
          nullable: true
          description: Расширенное описание параметра
          example: "Масса единицы объёма материала"
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Дата и время создания записи

    # Пользователи
    User:
      type: object
      description: Учётная запись пользователя
      properties:
        id:
          type: integer
          readOnly: true
          description: Уникальный идентификатор
          example: 1
        login:
          type: string
          minLength: 3
          maxLength: 50
          description: Логин пользователя
          example: "ivanov"
        role:
          type: string
          enum: [researcher, admin]
          description: Роль пользователя
          example: "researcher"
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Дата и время создания учётной записи
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Дата и время последнего обновления

    CreateUserRequest:
      type: object
      required:
        - login
        - password
        - role
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 50
          description: Логин нового пользователя
        password:
          type: string
          minLength: 6
          maxLength: 100
          description: Пароль (будет захэширован на сервере)
          format: password
        role:
          type: string
          enum: [researcher, admin]
          description: Роль пользователя

    UpdateUserRequest:
      type: object
      properties:
        role:
          type: string
          enum: [researcher, admin]
          description: Новая роль пользователя

    # История расчётов
    CalculationHistoryItem:
      type: object
      description: Элемент истории расчётов
      properties:
        id:
          type: integer
          description: Идентификатор расчёта
        user_id:
          type: integer
          description: ID пользователя, выполнившего расчёт
        material_id:
          type: integer
          description: ID использованного материала
        input_json:
          type: string
          description: Входные параметры в формате JSON
        result_json:
          type: string
          description: Результаты расчёта в формате JSON
        created_at:
          type: string
          format: date-time
          description: Дата и время выполнения расчёта

    CalculationReport:
      type: object
      description: Отчёт о расчёте
      properties:
        id:
          type: integer
          description: Идентификатор расчёта
        user_id:
          type: integer
          description: ID пользователя
        material_id:
          type: integer
          description: ID материала
        created_at:
          type: string
          format: date-time
          description: Дата и время расчёта
        input:
          type: object
          description: Входные параметры расчёта
        result:
          type: object
          description: Результаты расчёта

    # Ошибки
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Тип ошибки
          example: "validation_error"
        message:
          type: string
          description: Человекочитаемое сообщение об ошибке
          example: "Поле 'w' должно быть больше 0.001"
        details:
          type: object
          additionalProperties: true
          description: Дополнительные детали ошибки

    # Общие ответы
    IdResponse:
      type: object
      properties:
        id:
          type: integer
          description: Идентификатор созданной/обновлённой сущности
          example: 5

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          description: Информационное сообщение
          example: "Операция выполнена успешно"

    ValidationSuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: "Валидация пройдена"

# ПУТИ
paths:
  # АУТЕНТИФИКАЦИЯ
  /api/auth/register:
    post:
      summary: Регистрация нового пользователя
      description: |
        Создаёт новую учётную запись с ролью researcher.
        Доступно без авторизации.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          description: Ошибка валидации или пользователь уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                conflict:
                  value:
                    error: "conflict"
                    message: "Пользователь уже существует"
                validation:
                  value:
                    error: "validation_error"
                    message: "Логин и пароль обязательны"

  /api/auth/login:
    post:
      summary: Вход в систему
      description: |
        Аутентификация пользователя по логину и паролю.
        Возвращает JWT токен для авторизации.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Неверный логин или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "invalid_credentials"
                message: "Неверный логин или пароль"

  /api/auth/logout:
    post:
      summary: Выход из системы
      description: |
        Завершение сеанса работы.
        Клиент должен удалить JWT токен.
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успешный выход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Выход выполнен успешно"

  /api/auth/me:
    get:
      summary: Информация о текущем пользователе
      description: Возвращает данные авторизованного пользователя
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Данные пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ВАЛИДАЦИЯ
  /api/validate:
    post:
      summary: Валидация входных параметров
      description: |
        Проверяет корректность входных параметров без выполнения расчёта.
        Полезно для предварительной проверки формы.
      tags: [Calculation]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculationInput'
      responses:
        '200':
          description: Валидация пройдена успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationSuccessResponse'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "validation_error"
                message: "Ошибка валидации"
                details:
                  fields:
                    - field: "w"
                      message: "должно быть от 0.001 до 10.0"
        '401':
          description: Не авторизован

  # РАСЧЁТ
  /api/calculate:
    post:
      summary: Расчёт параметров течения
      description: |
        Выполняет численное моделирование неизотермического течения
        аномально-вязкого материала в канале с подвижной крышкой.
        Возвращает распределения температуры и вязкости по длине канала,
        а также итоговые показатели процесса.
        Результаты автоматически сохраняются в истории расчётов.
      tags: [Calculation]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculationInput'
      responses:
        '200':
          description: Результаты расчёта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationResult'
        '400':
          description: Ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
        '500':
          description: Внутренняя ошибка сервера при расчёте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ИСТОРИЯ РАСЧЁТОВ
  /api/results:
    get:
      summary: История расчётов
      description: Возвращает список всех сохранённых расчётов
      tags: [Results]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список расчётов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalculationHistoryItem'
        '401':
          description: Не авторизован

  /api/results/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Идентификатор расчёта
        schema:
          type: integer
          minimum: 1
    get:
      summary: Получить расчёт по ID
      description: Возвращает полную информацию о сохранённом расчёте
      tags: [Results]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Данные расчёта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationHistoryItem'
        '401':
          description: Не авторизован
        '404':
          description: Расчёт не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/results/{id}/report:
    parameters:
      - name: id
        in: path
        required: true
        description: Идентификатор расчёта
        schema:
          type: integer
          minimum: 1
    get:
      summary: Получить отчёт о расчёте
      description: Возвращает структурированный отчёт с входными и выходными данными
      tags: [Results]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Отчёт о расчёте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationReport'
        '401':
          description: Не авторизован
        '404':
          description: Расчёт не найден

  /api/results/{id}/download:
    parameters:
      - name: id
        in: path
        required: true
        description: Идентификатор расчёта
        schema:
          type: integer
          minimum: 1
    get:
      summary: Скачать отчёт
      description: |
        Скачивает отчёт о расчёте в формате JSON.
        Файл имеет имя report_{id}.json
      tags: [Results]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Файл отчёта
          content:
            application/json:
              schema:
                type: object
          headers:
            Content-Disposition:
              description: Имя файла для скачивания
              schema:
                type: string
                example: attachment; filename=report_42.json
        '401':
          description: Не авторизован
        '404':
          description: Расчёт не найден

  # МАТЕРИАЛЫ (общий доступ)
  /api/materials:
    get:
      summary: Список материалов (краткий)
      description: Возвращает список всех материалов для использования в выпадающем списке
      tags: [Materials]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список материалов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaterialListItem'
        '401':
          description: Не авторизован

  # АДМИНИСТРИРОВАНИЕ: МАТЕРИАЛЫ
  /api/admin/materials:
    get:
      summary: Список материалов (полный)
      description: Возвращает полную информацию обо всех материалах
      tags: [Admin - Materials]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список материалов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Material'
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещён (требуются права администратора)

    post:
      summary: Создать материал
      description: Добавляет новый тип материала в справочник
      tags: [Admin - Materials]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Название материала
                description:
                  type: string
                  nullable: true
                  description: Описание материала
      responses:
        '201':
          description: Материал создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещён

  /api/admin/materials/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Идентификатор материала
        schema:
          type: integer
          minimum: 1
    get:
      summary: Получить материал по ID
      tags: [Admin - Materials]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Информация о материале
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещён
        '404':
          description: Материал не найден

    put:
      summary: Обновить материал
      description: Изменяет название и/или описание материала
      tags: [Admin - Materials]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Новое название
                description:
                  type: string
                  nullable: true
                  description: Новое описание
      responses:
        '200':
          description: Материал обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Материал обновлён"
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
        '403':
