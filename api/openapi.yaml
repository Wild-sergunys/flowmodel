        - bearerAuth: []
      responses:
        '200':
          description: Список параметров
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parameter'
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещён

    post:
      summary: Создать параметр
      description: Добавляет новый параметр в словарь
      tags: [Admin - Parameters Dictionary]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, data_type, category]
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 50
                  pattern: '^[a-z0-9_]+$'
                  description: Технический код (латиница, цифры, _)
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Человекочитаемое название
                unit:
                  type: string
                  nullable: true
                  description: Единица измерения
                data_type:
                  type: string
                  enum: [float, int, string]
                  description: Тип данных значения
                category:
                  type: string
                  enum: [material_property, empirical_coefficient, process_parameter]
                  description: Категория параметра
                description:
                  type: string
                  nullable: true
                  description: Расширенное описание
      responses:
        '201':
          description: Параметр создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          description: Ошибка валидации
